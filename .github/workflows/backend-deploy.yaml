name: Deploy Spring Boot

on:
  push:
    branches:
      - main_sub
      - jaeyoung

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: wellsy_backend/pom.xml

      - name: Build JAR
        working-directory: wellsy_backend
        run: mvn clean package -DskipTests

      - name: Prepare EC2 directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            mkdir -p /home/ubuntu/upload
            rm -f /home/ubuntu/upload/*.jar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "wellsy_backend/target/*.jar"
          target: "/home/ubuntu/upload/"
          strip_components: 2

      - name: Deploy Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/app"
            UPLOAD_DIR="/home/ubuntu/upload"

            JAR_FILE="$APP_DIR/wellsy.jar"
            BACKUP_JAR="$APP_DIR/wellsy-backup.jar"

            PID_FILE="$APP_DIR/wellsy.pid"
            LOG_FILE="$APP_DIR/wellsy.log"

            HEALTH_URL="http://127.0.0.1:8006/actuator/health"

            mkdir -p "$APP_DIR"

            echo "=========================================="
            echo "       Starting backend deployment"
            echo "=========================================="

            echo ""
            echo "===== Finding uploaded JAR ====="

            NEW_JAR=$(find "$UPLOAD_DIR" -maxdepth 1 -type f -name "*.jar" | head -n 1)

            if [ -z "$NEW_JAR" ]; then
              echo "ERROR: JAR file not found in $UPLOAD_DIR"
              exit 1
            fi

            echo "New JAR found:"
            echo "$NEW_JAR"

            echo ""
            echo "===== Backing up current JAR ====="

            if [ -f "$JAR_FILE" ]; then
              cp "$JAR_FILE" "$BACKUP_JAR"
              echo "Current JAR backed up."
            else
              echo "No existing JAR to back up."
            fi

            echo ""
            echo "===== Stopping existing Spring Boot ====="

            OLD_PID=$(sudo fuser 8006/tcp 2>/dev/null | tr -d ' ' || true)

            if [ -n "$OLD_PID" ]; then
              echo "Port 8006 is currently used by PID: $OLD_PID"

              sudo kill "$OLD_PID" || true

              for i in {1..15}; do
                if ! sudo kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "Old Spring Boot process stopped."
                  break
                fi

                echo "Waiting for PID $OLD_PID to stop... ($i/15)"
                sleep 1
              done

              if sudo kill -0 "$OLD_PID" 2>/dev/null; then
                echo "PID $OLD_PID is still alive. Force killing..."
                sudo kill -9 "$OLD_PID" || true
                sleep 3
              fi
            else
              echo "No process is using port 8006."
            fi

            rm -f "$PID_FILE"

            echo ""
            echo "===== Checking port 8006 ====="

            if sudo fuser 8006/tcp >/dev/null 2>&1; then
              echo "ERROR: Port 8006 is STILL occupied."
              sudo fuser -v 8006/tcp || true
              exit 1
            fi

            echo "Port 8006 is free."

            echo ""
            echo "===== Deploying new JAR ====="

            rm -f "$JAR_FILE"
            mv "$NEW_JAR" "$JAR_FILE"

            echo "New JAR deployed to:"
            echo "$JAR_FILE"

            echo ""
            echo "===== Loading environment variables ====="

            export DB_URL='${{ secrets.DB_URL }}'
            export DB_USERNAME='${{ secrets.DB_USERNAME }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'

            export GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}'

            export MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}'
            export MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}'

            cd "$APP_DIR"

            echo ""
            echo "===== Starting Spring Boot ====="

            rm -f "$LOG_FILE"

            nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &

            NEW_PID=$!

            echo "$NEW_PID" > "$PID_FILE"

            echo "New Spring Boot PID: $NEW_PID"

            echo ""
            echo "===== Waiting for Spring Boot health check ====="

            STARTED=false

            for i in {1..60}; do

              if ! kill -0 "$NEW_PID" 2>/dev/null; then
                echo ""
                echo "ERROR: Spring Boot process terminated unexpectedly."

                echo ""
                echo "===== Spring Boot Log ====="
                tail -n 200 "$LOG_FILE" || true

                echo ""
                echo "===== Attempting rollback ====="

                if [ -f "$BACKUP_JAR" ]; then
                  cp "$BACKUP_JAR" "$JAR_FILE"

                  nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &

                  ROLLBACK_PID=$!

                  echo "$ROLLBACK_PID" > "$PID_FILE"

                  echo "Rollback started. PID: $ROLLBACK_PID"
                else
                  echo "No backup JAR available."
                fi

                exit 1
              fi

              HTTP_CODE=$(curl \
                -s \
                -o /tmp/wellsy-health-response.txt \
                -w "%{http_code}" \
                "$HEALTH_URL" || true)

              echo "Health check ($i/60): HTTP $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then

                echo ""
                echo "Spring Boot health check passed."

                echo "Health response:"
                cat /tmp/wellsy-health-response.txt || true
                echo ""

                STARTED=true
                break
              fi

              sleep 2
            done

            if [ "$STARTED" != "true" ]; then

              echo ""
              echo "ERROR: Spring Boot did not become healthy within 120 seconds."

              echo ""
              echo "===== Port 8006 status ====="
              sudo ss -lntp | grep 8006 || true

              echo ""
              echo "===== Health response ====="
              cat /tmp/wellsy-health-response.txt || true

              echo ""
              echo "===== Spring Boot Log ====="
              tail -n 200 "$LOG_FILE" || true

              echo ""
              echo "===== Stopping failed Spring Boot ====="

              if kill -0 "$NEW_PID" 2>/dev/null; then
                kill "$NEW_PID" || true
                sleep 3
              fi

              echo ""
              echo "===== Attempting rollback ====="

              if [ -f "$BACKUP_JAR" ]; then

                cp "$BACKUP_JAR" "$JAR_FILE"

                nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &

                ROLLBACK_PID=$!

                echo "$ROLLBACK_PID" > "$PID_FILE"

                echo "Rollback Spring Boot PID: $ROLLBACK_PID"

                echo ""
                echo "===== Waiting for rollback health check ====="

                ROLLBACK_OK=false

                for i in {1..30}; do

                  if ! kill -0 "$ROLLBACK_PID" 2>/dev/null; then
                    echo "Rollback process terminated."
                    break
                  fi

                  HTTP_CODE=$(curl \
                    -s \
                    -o /tmp/wellsy-rollback-health.txt \
                    -w "%{http_code}" \
                    "$HEALTH_URL" || true)

                  echo "Rollback health check ($i/30): HTTP $HTTP_CODE"

                  if [ "$HTTP_CODE" = "200" ]; then
                    ROLLBACK_OK=true
                    break
                  fi

                  sleep 2
                done

                if [ "$ROLLBACK_OK" = "true" ]; then
                  echo "Rollback completed successfully."
                else
                  echo "ERROR: Rollback also failed."

                  echo ""
                  echo "===== Rollback log ====="
                  tail -n 200 "$LOG_FILE" || true
                fi

              else
                echo "No backup JAR available."
              fi

              exit 1
            fi

            echo ""
            echo "=========================================="
            echo "       Deployment successful"
            echo "=========================================="

            echo "Spring Boot PID: $NEW_PID"
            echo "Health check: OK"

            echo ""
            echo "===== Port 8006 status ====="
            sudo ss -lntp | grep 8006 || true

            echo ""
            echo "===== Last 50 log lines ====="
            tail -n 50 "$LOG_FILE" || true

            exit 0