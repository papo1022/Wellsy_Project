name: Deploy Spring Boot

on:
  push:
    branches:
      - main_sub
      - jaeyoung

concurrency:
  group: wellsy-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: wellsy_backend/pom.xml

      - name: Build JAR
        working-directory: wellsy_backend
        run: mvn clean package -DskipTests

      - name: Prepare EC2 directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            mkdir -p /home/ubuntu/upload
            rm -f /home/ubuntu/upload/*.jar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "wellsy_backend/target/*.jar"
          target: "/home/ubuntu/upload/"
          strip_components: 2

      - name: Deploy Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/app"
            UPLOAD_DIR="/home/ubuntu/upload"

            JAR_FILE="$APP_DIR/wellsy.jar"
            BACKUP_JAR="$APP_DIR/wellsy-backup.jar"

            PID_FILE="$APP_DIR/wellsy.pid"
            LOG_FILE="$APP_DIR/wellsy.log"

            HEALTH_URL="http://127.0.0.1:8006/wellsy/actuator/health"

            mkdir -p "$APP_DIR"

            echo "=========================================="
            echo "       BACKEND DEPLOY START"
            echo "=========================================="

            echo ""
            echo "===== Finding uploaded JAR ====="

            NEW_JAR=$(find "$UPLOAD_DIR" -maxdepth 1 -type f -name "*.jar" | head -n 1)

            if [ -z "$NEW_JAR" ]; then
              echo "ERROR: No JAR file found in $UPLOAD_DIR"
              exit 1
            fi

            echo "Uploaded JAR:"
            echo "$NEW_JAR"

            echo ""
            echo "===== Backup current JAR ====="

            if [ -f "$JAR_FILE" ]; then
              cp "$JAR_FILE" "$BACKUP_JAR"
              echo "Backup created:"
              echo "$BACKUP_JAR"
            else
              echo "No current JAR found. Skipping backup."
            fi

            echo ""
            echo "===== Stop existing Spring Boot ====="

            OLD_PID=$(sudo fuser 8006/tcp 2>/dev/null | tr -d ' ' || true)

            if [ -n "$OLD_PID" ]; then
              echo "Port 8006 currently used by PID: $OLD_PID"

              sudo kill "$OLD_PID" || true

              for i in {1..20}; do

                if ! sudo kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "Old process stopped."
                  break
                fi

                echo "Waiting for old PID $OLD_PID... ($i/20)"
                sleep 1

              done

              if sudo kill -0 "$OLD_PID" 2>/dev/null; then
                echo "Old process still alive. Force killing PID $OLD_PID"
                sudo kill -9 "$OLD_PID" || true
                sleep 2
              fi
            else
              echo "No process currently using port 8006."
            fi

            rm -f "$PID_FILE"

            echo ""
            echo "===== Waiting for port 8006 to become free ====="

            for i in {1..20}; do

              if ! sudo fuser 8006/tcp >/dev/null 2>&1; then
                echo "Port 8006 is free."
                break
              fi

              echo "Waiting for port 8006... ($i/20)"
              sleep 1

            done

            if sudo fuser 8006/tcp >/dev/null 2>&1; then

              echo "Port 8006 is still occupied."

              PORT_PID=$(sudo fuser 8006/tcp 2>/dev/null | tr -d ' ' || true)

              if [ -n "$PORT_PID" ]; then
                echo "Force killing process using port 8006: $PORT_PID"
                sudo kill -9 "$PORT_PID" || true
                sleep 2
              fi

            fi

            if sudo fuser 8006/tcp >/dev/null 2>&1; then
              echo "ERROR: Port 8006 could not be released."
              sudo fuser -v 8006/tcp || true
              exit 1
            fi

            echo ""
            echo "===== Deploy new JAR ====="

            rm -f "$JAR_FILE"
            mv "$NEW_JAR" "$JAR_FILE"

            echo "New JAR installed:"
            echo "$JAR_FILE"

            echo ""
            echo "===== Export environment variables ====="

            export DB_URL='${{ secrets.DB_URL }}'
            export DB_USERNAME='${{ secrets.DB_USERNAME }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'

            export GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}'

            export MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}'
            export MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}'

            cd "$APP_DIR"

            echo ""
            echo "===== Start Spring Boot ====="

            rm -f "$LOG_FILE"

            nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &

            NEW_PID=$!

            echo "$NEW_PID" > "$PID_FILE"

            echo "New Spring Boot PID: $NEW_PID"

            echo ""
            echo "===== Wait for health check ====="

            HEALTH_OK=false

            for i in {1..60}; do

              if ! kill -0 "$NEW_PID" 2>/dev/null; then

                echo ""
                echo "ERROR: New Spring Boot process terminated."

                echo ""
                echo "===== Spring Boot log ====="
                tail -n 200 "$LOG_FILE" || true

                HEALTH_OK=false
                break

              fi

              HTTP_CODE=$(curl \
                -s \
                -o /tmp/wellsy-health-response.txt \
                -w "%{http_code}" \
                "$HEALTH_URL" || true)

              echo "Health check ($i/60): HTTP $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then

                echo ""
                echo "Health check passed."

                echo ""
                echo "===== Health response ====="
                cat /tmp/wellsy-health-response.txt || true
                echo ""

                HEALTH_OK=true
                break

              fi

              sleep 2

            done

            if [ "$HEALTH_OK" = "true" ]; then

              echo ""
              echo "=========================================="
              echo "       DEPLOYMENT SUCCESSFUL"
              echo "=========================================="

              echo "Spring Boot PID: $NEW_PID"
              echo "Health check: OK"

              echo ""
              echo "===== Port 8006 ====="
              sudo ss -lntp | grep 8006 || true

              echo ""
              echo "===== Last 50 log lines ====="
              tail -n 50 "$LOG_FILE" || true

              exit 0

            fi

            echo ""
            echo "=========================================="
            echo "       DEPLOYMENT FAILED"
            echo "=========================================="

            echo ""
            echo "===== Stop failed Spring Boot ====="

            if kill -0 "$NEW_PID" 2>/dev/null; then

              kill "$NEW_PID" || true

              for i in {1..15}; do

                if ! kill -0 "$NEW_PID" 2>/dev/null; then
                  echo "Failed process stopped."
                  break
                fi

                echo "Waiting for failed process... ($i/15)"
                sleep 1

              done

              if kill -0 "$NEW_PID" 2>/dev/null; then
                echo "Force killing failed process."
                kill -9 "$NEW_PID" || true
                sleep 2
              fi

            fi

            echo ""
            echo "===== Wait for port 8006 before rollback ====="

            for i in {1..20}; do

              if ! sudo fuser 8006/tcp >/dev/null 2>&1; then
                echo "Port 8006 is free."
                break
              fi

              echo "Waiting for port 8006... ($i/20)"
              sleep 1

            done

            if sudo fuser 8006/tcp >/dev/null 2>&1; then

              PORT_PID=$(sudo fuser 8006/tcp 2>/dev/null | tr -d ' ' || true)

              if [ -n "$PORT_PID" ]; then

                echo "Force killing remaining process on port 8006:"
                echo "$PORT_PID"

                sudo kill -9 "$PORT_PID" || true
                sleep 2

              fi

            fi

            if sudo fuser 8006/tcp >/dev/null 2>&1; then
              echo "ERROR: Port 8006 still occupied. Rollback cannot continue."
              sudo fuser -v 8006/tcp || true
              exit 1
            fi

            echo ""
            echo "===== Rollback ====="

            if [ ! -f "$BACKUP_JAR" ]; then

              echo "ERROR: Backup JAR does not exist."
              echo "Rollback unavailable."

              echo ""
              echo "===== Failed Spring log ====="
              tail -n 200 "$LOG_FILE" || true

              exit 1

            fi

            cp "$BACKUP_JAR" "$JAR_FILE"

            echo "Backup restored."

            rm -f "$LOG_FILE"

            nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &

            ROLLBACK_PID=$!

            echo "$ROLLBACK_PID" > "$PID_FILE"

            echo "Rollback Spring Boot PID: $ROLLBACK_PID"

            echo ""
            echo "===== Wait for rollback health check ====="

            ROLLBACK_OK=false

            for i in {1..60}; do

              if ! kill -0 "$ROLLBACK_PID" 2>/dev/null; then

                echo "ERROR: Rollback process terminated."

                echo ""
                echo "===== Rollback log ====="
                tail -n 200 "$LOG_FILE" || true

                break

              fi

              HTTP_CODE=$(curl \
                -s \
                -o /tmp/wellsy-rollback-health.txt \
                -w "%{http_code}" \
                "$HEALTH_URL" || true)

              echo "Rollback health check ($i/60): HTTP $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then

                ROLLBACK_OK=true

                echo ""
                echo "Rollback health check passed."

                break

              fi

              sleep 2

            done

            if [ "$ROLLBACK_OK" = "true" ]; then

              echo ""
              echo "=========================================="
              echo "       ROLLBACK SUCCESSFUL"
              echo "=========================================="

              echo "Rollback PID: $ROLLBACK_PID"

              echo ""
              echo "===== Port 8006 ====="
              sudo ss -lntp | grep 8006 || true

              echo ""
              echo "===== Last rollback log lines ====="
              tail -n 50 "$LOG_FILE" || true

              exit 1

            fi

            echo ""
            echo "=========================================="
            echo "       ROLLBACK FAILED"
            echo "=========================================="

            echo ""
            echo "===== Rollback log ====="
            tail -n 200 "$LOG_FILE" || true

            exit 1