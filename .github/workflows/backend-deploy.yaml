name: Deploy Spring Boot

on:
  push:
    branches:
      - main_sub
      - jaeyoung

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: wellsy_backend/pom.xml

      - name: Build JAR
        working-directory: wellsy_backend
        run: mvn clean package -DskipTests

      - name: Prepare EC2 directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            mkdir -p /home/ubuntu/upload
            rm -f /home/ubuntu/upload/*.jar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "wellsy_backend/target/*.jar"
          target: "/home/ubuntu/upload/"
          strip_components: 2

      - name: Deploy Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/app"
            UPLOAD_DIR="/home/ubuntu/upload"
            JAR_FILE="$APP_DIR/wellsy.jar"
            PID_FILE="$APP_DIR/wellsy.pid"
            LOG_FILE="$APP_DIR/wellsy.log"

            mkdir -p "$APP_DIR"

            echo "===== Stopping existing Spring Boot ====="

            if [ -f "$PID_FILE" ]; then
              OLD_PID=$(cat "$PID_FILE")

              if kill -0 "$OLD_PID" 2>/dev/null; then
                echo "Stopping existing Spring Boot process: $OLD_PID"
                kill "$OLD_PID" || true

                for i in {1..15}; do
                  if ! kill -0 "$OLD_PID" 2>/dev/null; then
                    echo "Old Spring Boot process stopped."
                    break
                  fi

                  echo "Waiting for process to stop... ($i/15)"
                  sleep 1
                done

                if kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "Process did not stop. Force killing PID: $OLD_PID"
                  kill -9 "$OLD_PID" || true
                  sleep 2
                fi
              fi

              rm -f "$PID_FILE"
            fi

            if sudo fuser 8006/tcp >/dev/null 2>&1; then
              echo "Port 8006 is still in use."
              sudo fuser -k 8006/tcp || true
              sleep 3
            fi

            if sudo fuser 8006/tcp >/dev/null 2>&1; then
              echo "ERROR: Port 8006 is still occupied."
              sudo fuser -v 8006/tcp || true
              exit 1
            fi

            echo "Port 8006 is free."

            NEW_JAR=$(find "$UPLOAD_DIR" -maxdepth 1 -type f -name "*.jar" | head -n 1)

            if [ -z "$NEW_JAR" ]; then
              echo "JAR file not found in $UPLOAD_DIR"
              exit 1
            fi

            echo "Deploying $NEW_JAR"

            rm -f "$JAR_FILE"
            mv "$NEW_JAR" "$JAR_FILE"

            export DB_URL='${{ secrets.DB_URL }}'
            export DB_USERNAME='${{ secrets.DB_USERNAME }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}'

            cd "$APP_DIR"

            echo "===== Starting Spring Boot ====="

            nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &
            NEW_PID=$!
            echo "$NEW_PID" > "$PID_FILE"

            echo "New Spring Boot PID: $NEW_PID"

            sleep 20

            if ! kill -0 "$NEW_PID" 2>/dev/null; then
              echo "ERROR: Spring Boot process terminated."
              echo "===== Spring Boot Log ====="
              cat "$LOG_FILE"
              exit 1
            fi

            if ! sudo fuser 8006/tcp >/dev/null 2>&1; then
              echo "ERROR: Spring Boot process exists but port 8006 is not listening."
              echo "===== Spring Boot Log ====="
              tail -n 100 "$LOG_FILE"
              exit 1
            fi

            echo "===== Deployment successful ====="
            echo "Spring Boot PID: $NEW_PID"
            echo "Port 8006 is listening."

            echo "===== Last 30 log lines ====="
            tail -n 30 "$LOG_FILE"