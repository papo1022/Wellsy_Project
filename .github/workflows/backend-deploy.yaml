name: Deploy Spring Boot

on:
  push:
    branches: 
      - main_sub
      - jaeyoung

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          cache-dependency-path: wellsy_backend/pom.xml  # ⭐ 추가: pom.xml 경로 명시

      - name: Build JAR
        working-directory: wellsy_backend
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "wellsy_backend/target/*.jar"
          target: "/home/ubuntu/upload/"
          strip_components: 2

      - name: Deploy Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/app"
            UPLOAD_DIR="/home/ubuntu/upload"
            JAR_FILE="$APP_DIR/wellsy.jar"
            PID_FILE="$APP_DIR/wellsy.pid"
            LOG_FILE="$APP_DIR/wellsy.log"

            mkdir -p "$APP_DIR"

            # 기존 PID로 실행 중인 서버 종료
            if [ -f "$PID_FILE" ]; then
              OLD_PID=$(cat "$PID_FILE")

              if kill -0 "$OLD_PID" 2>/dev/null; then
                echo "Stopping existing Spring Boot process (PID: $OLD_PID)..."
                kill "$OLD_PID"
                sleep 5
              fi

              rm -f "$PID_FILE"
            fi

            # PID 파일이 없지만 8006 포트를 점유한 프로세스가 있을 경우 종료
            if sudo fuser 8006/tcp 2>/dev/null; then
              echo "Killing process on port 8006..."
              sudo fuser -k 8006/tcp 2>/dev/null || true
              sleep 2
            fi

            # 새 JAR 배치
            echo "Deploying new JAR file..."
            rm -f "$JAR_FILE"
            
            # ⭐ 개선: JAR 파일 존재 여부 확인
            if [ -z "$(ls -A $UPLOAD_DIR/*.jar 2>/dev/null)" ]; then
              echo "❌ JAR file not found in $UPLOAD_DIR"
              exit 1
            fi
            
            mv "$UPLOAD_DIR"/*.jar "$JAR_FILE"

            # DB 환경변수
            export DB_URL='${{ secrets.DB_URL }}'
            export DB_USERNAME='${{ secrets.DB_USERNAME }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'

            # 백그라운드 실행
            cd "$APP_DIR"
            echo "Starting Spring Boot application..."
            nohup java -jar "$JAR_FILE" > "$LOG_FILE" 2>&1 &
            echo $! > "$PID_FILE"

            # 실행 대기
            sleep 15

            # 프로세스 확인
            if ! kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              echo "❌ Spring Boot 실행 실패"
              echo "=== Application Log ==="
              cat "$LOG_FILE"
              exit 1
            fi

            echo "✅ Spring Boot 배포 성공 (PID: $(cat $PID_FILE))"