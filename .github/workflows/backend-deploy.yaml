

name: Deploy Spring Boot

on:
  push:
    branches:
      - main_sub
      - jaeyoung

concurrency:
  group: wellsy-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: wellsy_backend/pom.xml

      - name: Build JAR
        working-directory: wellsy_backend
        run: mvn clean package -DskipTests

      - name: Prepare EC2 upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p /home/ubuntu/upload
            rm -f /home/ubuntu/upload/*.jar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "wellsy_backend/target/*.jar"
          target: "/home/ubuntu/upload/"
          strip_components: 2

      - name: Deploy Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            SERVICE_NAME="wellsy.service"

            UPLOAD_DIR="/home/ubuntu/upload"

            JAR_FILE="/home/ubuntu/wellsy_backend.jar"
            BACKUP_JAR="/home/ubuntu/wellsy_backend-backup.jar"

            HEALTH_URL="http://127.0.0.1:8006/wellsy/actuator/health"

            echo "=========================================="
            echo "       WELLSY BACKEND DEPLOY START"
            echo "=========================================="

            echo ""
            echo "===== Find uploaded JAR ====="

            NEW_JAR=$(find "$UPLOAD_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              | head -n 1)

            if [ -z "$NEW_JAR" ]; then
              echo "ERROR: Uploaded JAR not found."
              exit 1
            fi

            echo "Uploaded JAR: $NEW_JAR"

            echo ""
            echo "===== Stop service ====="

            sudo systemctl stop "$SERVICE_NAME"

            for i in {1..20}; do
              STATUS=$(sudo systemctl is-active "$SERVICE_NAME" || true)

              if [ "$STATUS" != "active" ]; then
                echo "Service stopped."
                break
              fi

              echo "Waiting for service to stop... ($i/20)"
              sleep 1
            done

            STATUS=$(sudo systemctl is-active "$SERVICE_NAME" || true)

            if [ "$STATUS" = "active" ]; then
              echo "ERROR: Service did not stop."
              sudo systemctl status "$SERVICE_NAME" --no-pager || true
              exit 1
            fi

            echo ""
            echo "===== Check port 8006 ====="

            for i in {1..20}; do
              if ! sudo fuser 8006/tcp >/dev/null 2>&1; then
                echo "Port 8006 is free."
                break
              fi

              echo "Waiting for port 8006... ($i/20)"
              sleep 1
            done

            if sudo fuser 8006/tcp >/dev/null 2>&1; then
              echo "ERROR: Port 8006 is still occupied."
              sudo fuser -v 8006/tcp || true
              exit 1
            fi

            echo ""
            echo "===== Backup current JAR ====="

            if [ -f "$JAR_FILE" ]; then
              cp "$JAR_FILE" "$BACKUP_JAR"
              echo "Backup created: $BACKUP_JAR"
            else
              echo "No current JAR found. Skipping backup."
            fi

            echo ""
            echo "===== Replace JAR ====="

            mv "$NEW_JAR" "$JAR_FILE"
            chmod 755 "$JAR_FILE"

            echo "New JAR installed: $JAR_FILE"

            echo ""
            echo "===== Start service ====="

            sudo systemctl start "$SERVICE_NAME"

            echo ""
            echo "===== Health check ====="

            HEALTH_OK=false

            for i in {1..60}; do

              STATUS=$(sudo systemctl is-active "$SERVICE_NAME" || true)

              if [ "$STATUS" != "active" ]; then
                echo "ERROR: Service stopped during startup."

                sudo systemctl status "$SERVICE_NAME" \
                  --no-pager || true

                sudo journalctl \
                  -u "$SERVICE_NAME" \
                  -n 200 \
                  --no-pager || true

                break
              fi

              HTTP_CODE=$(curl \
                -s \
                -o /tmp/wellsy-health.txt \
                -w "%{http_code}" \
                "$HEALTH_URL" || true)

              echo "Health check ($i/60): HTTP $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then
                HEALTH_OK=true
                break
              fi

              sleep 2
            done

            if [ "$HEALTH_OK" = "true" ]; then

              echo ""
              echo "=========================================="
              echo "       DEPLOYMENT SUCCESSFUL"
              echo "=========================================="

              echo ""
              echo "===== Health response ====="
              cat /tmp/wellsy-health.txt || true
              echo ""

              echo ""
              echo "===== Service status ====="
              sudo systemctl status "$SERVICE_NAME" \
                --no-pager || true

              echo ""
              echo "===== Port 8006 ====="
              sudo ss -lntp | grep 8006 || true

              echo ""
              echo "===== Recent logs ====="
              sudo journalctl \
                -u "$SERVICE_NAME" \
                -n 50 \
                --no-pager || true

              rm -f "$UPLOAD_DIR"/*.jar

              exit 0
            fi

            echo ""
            echo "=========================================="
            echo "       DEPLOYMENT FAILED"
            echo "=========================================="

            echo ""
            echo "===== Stop failed service ====="

            sudo systemctl stop "$SERVICE_NAME" || true

            for i in {1..20}; do
              if ! sudo fuser 8006/tcp >/dev/null 2>&1; then
                echo "Port 8006 is free."
                break
              fi

              echo "Waiting for port 8006... ($i/20)"
              sleep 1
            done

            if sudo fuser 8006/tcp >/dev/null 2>&1; then
              echo "ERROR: Port 8006 is still occupied."
              sudo fuser -v 8006/tcp || true
              exit 1
            fi

            echo ""
            echo "===== Rollback ====="

            if [ ! -f "$BACKUP_JAR" ]; then
              echo "ERROR: Backup JAR does not exist."

              sudo journalctl \
                -u "$SERVICE_NAME" \
                -n 200 \
                --no-pager || true

              exit 1
            fi

            cp "$BACKUP_JAR" "$JAR_FILE"
            chmod 755 "$JAR_FILE"

            echo "Backup restored."

            sudo systemctl start "$SERVICE_NAME"

            echo ""
            echo "===== Rollback health check ====="

            ROLLBACK_OK=false

            for i in {1..60}; do

              STATUS=$(sudo systemctl is-active "$SERVICE_NAME" || true)

              if [ "$STATUS" != "active" ]; then
                echo "ERROR: Rollback service stopped."

                sudo journalctl \
                  -u "$SERVICE_NAME" \
                  -n 200 \
                  --no-pager || true

                break
              fi

              HTTP_CODE=$(curl \
                -s \
                -o /tmp/wellsy-rollback-health.txt \
                -w "%{http_code}" \
                "$HEALTH_URL" || true)

              echo "Rollback health check ($i/60): HTTP $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then
                ROLLBACK_OK=true
                break
              fi

              sleep 2
            done

            if [ "$ROLLBACK_OK" = "true" ]; then

              echo ""
              echo "=========================================="
              echo "       ROLLBACK SUCCESSFUL"
              echo "=========================================="

              sudo systemctl status "$SERVICE_NAME" \
                --no-pager || true

              sudo journalctl \
                -u "$SERVICE_NAME" \
                -n 50 \
                --no-pager || true

              exit 1
            fi

            echo ""
            echo "=========================================="
            echo "       ROLLBACK FAILED"
            echo "=========================================="

            sudo systemctl status "$SERVICE_NAME" \
              --no-pager || true

            sudo journalctl \
              -u "$SERVICE_NAME" \
              -n 200 \
              --no-pager || true

            exit 1