# ==========================================
# SERVER
# ==========================================

server.port=8006

server.servlet.context-path=/wellsy


# ==========================================
# MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/wellsy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

spring.datasource.username=root

spring.datasource.password=mysql



# ==========================================
# JPA / HIBERNATE
# ==========================================

# DB 테이블을 직접 생성했기 때문에
# Hibernate가 테이블 구조를 변경하지 않도록 validate 사용
spring.jpa.hibernate.ddl-auto=validate


# 실행되는 SQL 출력
spring.jpa.show-sql=true


# SQL 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true

# AI용 API 키 설정
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# 이메일 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# JPA ETC
# ==========================================

spring.jpa.open-in-view=false