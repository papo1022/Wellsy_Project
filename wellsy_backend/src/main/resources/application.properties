# ==========================================
# SERVER
# ==========================================

server.port=8006

server.servlet.context-path=/wellsy


# ==========================================
# MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/wellsy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

spring.datasource.username=root

spring.datasource.password=root



# ==========================================
# JPA / HIBERNATE
# ==========================================

# DB 테이블을 직접 생성했기 때문에
# Hibernate가 테이블 구조를 변경하지 않도록 validate 사용
spring.jpa.hibernate.ddl-auto=validate


# 실행되는 SQL 출력
spring.jpa.show-sql=true


# SQL 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true

# AI용 API 키 설정
spring.ai.google.genai.api-key=본인이_발급받은_키
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# ==========================================
# JPA ETC
# ==========================================

spring.jpa.open-in-view=false